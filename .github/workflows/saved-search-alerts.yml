name: MotorScout saved-search checks
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: motorscout-saved-search-checks
  cancel-in-progress: false
jobs:
  check-enabled-alerts:
    if: github.repository == 'reedjvanness-star/motorscout' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Check only explicitly enabled alerts
        env:
          MOTORSCOUT_URL: https://motorscout-ai.reedjvanness.chatgpt.site
        shell: bash
        run: |
          set -euo pipefail
          AUDIENCE="$MOTORSCOUT_URL/api/jobs/alerts"
          OIDC_TOKEN=$(curl --fail --silent --show-error --max-time 20 \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -er '.value')
          echo "::add-mask::$OIDC_TOKEN"
          printf '%s' "$OIDC_TOKEN" | python3 -c 'import sys,json,base64; p=sys.stdin.read().split(".")[1]; c=json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4))); print(json.dumps({k:c.get(k) for k in ["iss","aud","repository","repository_id","repository_owner_id","ref","workflow_ref","event_name","iat","nbf","exp"]}))'
          curl --fail-with-body --silent --show-error --max-time 120 \
            --request POST \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            "$AUDIENCE"
